# Deploys Kit on your phone (the phone/ server) to https://kit.sttark.com, on the
# sttark-building Linode next to Building and HVAC. On each push to main that
# changes the server, and by hand (Actions > phone-deploy > Run workflow).
# Changes here never make a Mac release (release.yml builds only from the Mac app's files).
#
# The runner tests and builds the server, keeps only its production modules,
# and packs server.mjs, dist/, package.json and node_modules. It sends the pack
# and the VAULT_* secrets over SSH to the kit user's forced command on the box,
# /usr/local/bin/kit-deploy (Sttark/building, ansible roles/kit). Whatever this
# job asks for, the box runs that script and nothing else. It unpacks the pack
# to releases/<sha>, writes the env file (mode 600), moves the current link,
# restarts claude-kit, checks /healthz, and goes back to the last release when
# the check fails, so this job's result is the deploy's result.
# The box sets NODE_ENV, HOST, PORT and KIT_DB itself.
#
# Until the box is set up, the repository variable KIT_DEPLOY_READY is not
# 'true' and the job skips with a notice. It never fails for that: a failed run
# on main emails its author. How the box gets ready: Sttark/building,
# ansible/README.md, "Kit on this box".
#
# Secrets, in this repo's production environment (Settings > Environments >
# production), which admits only main, so a workflow edited on a branch cannot
# read them:
#   DEPLOY_SSH_KEY              the key that can only run kit-deploy; its public
#                               half is kit_deploy_keys in Sttark/building
#   VAULT_GOOGLE_CLIENT_ID      the shared Workspace sign-in client
#   VAULT_GOOGLE_CLIENT_SECRET
#   VAULT_ORG_SYNC_TOKEN        the Kit's own read-only Workrouter org-sync key
#   VAULT_VAPID_PUBLIC_KEY      the Web Push key pair
#   VAULT_VAPID_PRIVATE_KEY
# A missing VAULT_* secret goes out empty, with a warning that names it.
name: phone-deploy

on:
  push:
    branches: [main]
    paths:
      - 'phone/**'
      - '!phone/DESIGN.md'
      - '!phone/schema/**'
      - '!phone/fixtures/**'
      - '!phone/asyncapi.yaml'
      - '.github/workflows/phone-deploy.yml'
  workflow_dispatch:

concurrency:
  group: phone-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  # sttark-building, and its own host key, so a different box answering on
  # this address is refused (the same line as hvac_automation's deploy).
  DEPLOY_HOST: 45.33.102.173
  DEPLOY_HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINOnWYkEYeWDbLTJST67wb4dEBrC5xUfhjIvdssZiWzR

jobs:
  not-ready:
    name: Skipped
    if: vars.KIT_DEPLOY_READY != 'true' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Say why
        env:
          READY: ${{ vars.KIT_DEPLOY_READY }}
          REF: ${{ github.ref }}
        run: |
          if [ "$READY" != true ]; then
            echo "::notice title=Phone deploy skipped::kit.sttark.com is not set up yet. When it is (Sttark/building ansible/README.md, \"Kit on this box\"), set the repository variable KIT_DEPLOY_READY to true."
          else
            echo "::notice title=Phone deploy skipped::Only main deploys; this run is on $REF."
          fi

  deploy:
    if: vars.KIT_DEPLOY_READY == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    defaults:
      run:
        working-directory: phone
    steps:
      - uses: actions/checkout@v4
      # The box runs Node 24 (Sttark/building roles/node); a native module
      # built here must match it.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: phone/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Keep only the production modules
        run: npm prune --omit=dev --no-audit --no-fund

      - name: Pack
        run: |
          for f in server.mjs dist package.json node_modules; do
            test -e "$f" || { echo "::error::phone/$f is missing; the pack needs server.mjs, dist/, package.json and node_modules"; exit 1; }
          done
          mkdir -p "$RUNNER_TEMP/deploy/app"
          cp -R server.mjs dist package.json node_modules "$RUNNER_TEMP/deploy/app/"
          du -sh "$RUNNER_TEMP/deploy/app"

      # The env lines go in the pack, never in the log: names only below.
      - name: Env file from the secrets
        env:
          VAULT_GOOGLE_CLIENT_ID: ${{ secrets.VAULT_GOOGLE_CLIENT_ID }}
          VAULT_GOOGLE_CLIENT_SECRET: ${{ secrets.VAULT_GOOGLE_CLIENT_SECRET }}
          VAULT_ORG_SYNC_TOKEN: ${{ secrets.VAULT_ORG_SYNC_TOKEN }}
          VAULT_VAPID_PUBLIC_KEY: ${{ secrets.VAULT_VAPID_PUBLIC_KEY }}
          VAULT_VAPID_PRIVATE_KEY: ${{ secrets.VAULT_VAPID_PRIVATE_KEY }}
        run: |
          umask 077
          out="$RUNNER_TEMP/deploy/env"
          : > "$out"
          missing=()
          for name in VAULT_GOOGLE_CLIENT_ID VAULT_GOOGLE_CLIENT_SECRET VAULT_ORG_SYNC_TOKEN VAULT_VAPID_PUBLIC_KEY VAULT_VAPID_PRIVATE_KEY; do
            value=${!name}
            case "$value" in *$'\n'*|*$'\r'*) echo "::error::$name has a line break; set it again as one line"; exit 1 ;; esac
            [ -n "$value" ] || missing+=("$name")
            printf '%s=%s\n' "$name" "$value" >> "$out"
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::warning title=Empty secrets::${missing[*]} not set in the production environment; the server gets them empty."
          fi

      - name: Deploy key
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$SSH_KEY" || { echo "::error::DEPLOY_SSH_KEY is not set in the production environment"; exit 1; }
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          printf '%s %s\n' "$DEPLOY_HOST" "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts

      - name: kit-deploy
        run: |
          tar -C "$RUNNER_TEMP/deploy" -czf - app env \
            | ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes \
                -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o StrictHostKeyChecking=yes \
                "kit@$DEPLOY_HOST" "deploy $GITHUB_SHA"

      - name: Remove the key and the pack from the runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/deploy" ~/.ssh/deploy
