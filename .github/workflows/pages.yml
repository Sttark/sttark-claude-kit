# Publishes pages/ to GitHub Pages: https://sttark.github.io/sttark-claude-kit/
# open.html is the "Open in Claude" link in Kit messages (claude-notify); it opens a session in the Claude
# desktop app, or on claude.ai. Only the pages/ folder is published.
name: Pages
on:
  push:
    branches: [main]
    paths: [pages/**, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: pages }
      - id: deploy
        uses: actions/deploy-pages@v4
